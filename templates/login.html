{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block auth_content %}
<div class="form-heading"><div class="eyebrow">WELCOME BACK</div><h2>Sign in to StockFlow</h2><p>Pick up right where your inventory left off.</p></div>
<form method="post" class="auth-form">
  <div class="mb-3"><label class="form-label" for="email">Email address</label><div class="input-icon"><i class="bi bi-envelope"></i><input class="form-control" id="email" type="email" name="email" placeholder="you@company.com" required autocomplete="email"></div></div>
  <div class="mb-4"><label class="form-label" for="password">Password</label><div class="input-icon"><i class="bi bi-lock"></i><input class="form-control" id="password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"><button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
  <button class="btn btn-primary w-100 btn-lg" type="submit">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
</form>
<div class="auth-switch">New to StockFlow? <a href="{{ url_for('signup') }}">Create an account</a></div>
{% endblock %}
